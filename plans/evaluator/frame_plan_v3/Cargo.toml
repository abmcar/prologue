[package]
name = "frame-plan"
version = "0.1.0"
edition = "2021"
publish = false

[features]
prof = []

[dependencies]
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std", "tiny-keccak"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[lib]
path = "src/lib.rs"
